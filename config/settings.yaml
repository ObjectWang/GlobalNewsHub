# GlobalNewsHub 应用配置模板（PRD v3.0）
# core/constants.py（§2.2）为代码级默认值；本文件承载用户可覆盖项，
# 设置对话框（P4.6）的修改将持久化到本文件。

app:
  name: GlobalNewsHub
  version: "1.0.0"
  language: zh-CN

# 数据与资源路径（代码中一律用 pathlib.Path 处理，§1.2）
paths:
  database: data/globalnewshub.db       # SQLite ≥ 3.35，WAL + FTS5（§2.3）
  models_dir: resources/models          # INT8 ONNX 模型与 tokenizer（§3.1）
  icons_dir: resources/icons
  log_file: data/logs/globalnewshub.log

# 网络与抓取合规（§1.2、§九）
network:
  fetch_interval_seconds: 3             # FETCH_INTERVAL_SECONDS：请求最小间隔
  request_timeout: 10                   # REQUEST_TIMEOUT：单次请求超时（秒）
  max_retry: 3                          # MAX_RETRY：最大重试次数
  user_agent: "GlobalNewsHub/1.0 (+contact@email.com)"
  respect_robots_txt: true
  proxy: ""                             # 可选 HTTP(S) 代理，如 http://127.0.0.1:7890；
                                        # 留空=直连。境外源在无代理网络下不可达属预期

# 定时任务（APScheduler ≥ 3.10，§1.2）
scheduler:
  auto_refresh_enabled: true
  refresh_interval_minutes: 30
  max_concurrent_fetches: 5             # 全量刷新并发上限（§1.3：30 源 ≤ 5 秒）

# 内嵌 RSSHub（§4.2 RSSHubManager 接口契约；公共实例仅作降级兜底，§4.1）
rsshub:
  port: 1200                            # 被占用时自增查找（§4.2 _find_available_port）
  startup_timeout_seconds: 15           # start() 阻塞等待 /healthz 的上限
  stop_timeout_seconds: 5               # 优雅终止超时后强制 kill
  public_fallback_url: "https://rsshub.app"

# 智能分类（§3.1 模型规格、§3.2 置信度路由）
classifier:
  category_model: category_classifier_int8.onnx   # 位于 paths.models_dir 下
  region_model: region_classifier_int8.onnx       # 位于 paths.models_dir 下
  tokenizer_dir: tokenizer                        # 位于 paths.models_dir 下
  max_seq_length: 128                             # MAX_SEQ_LENGTH（§2.2）
  confidence_threshold_high: 0.7                  # ≥ 此值直接采纳模型结果（§2.2）
  confidence_threshold_low: 0.5                   # < 此值降级为关键词规则（§2.2）

# 源健康管理（§4.4）
health:
  fail_threshold: 3                     # HEALTH_FAIL_THRESHOLD：连续失败 N 次自动禁用（§2.2）
  recent_window: 5                      # 内存环形缓冲保存最近 N 次抓取状态

# 存储（§2.3）
storage:
  wal_enabled: true
  fts_enabled: true

# UI（Phase 4）
ui:
  theme: light                          # light | dark，对应 ui/themes/*.qss（P4.7）
  list_page_size: 200                   # 虚拟滚动分页（§1.3：1000 条 ≥ 30fps）
