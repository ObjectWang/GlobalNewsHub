# GlobalNewsHub 新闻源配置模板（PRD v3.0 §4.3 / §4.4）
#
# 字段契约：
#   id               源唯一标识，对应 source_health.source_id（§2.3）
#   name             媒体名，写入 Article.source_media（§2.1）
#   type             rss | rsshub
#   url              type=rss 时的原生 RSS 地址（§4.3：直连优先）
#   fallback_rsshub  type=rss 可选：直连失败时降级的本地 RSSHub 路由（§4.3），
#                    无则填 null；示例值：/thepaper/featured
#   route            type=rsshub 时的本地 RSSHub 路由（§4.3：失败再降级公共实例）
#   category         初始栏目提示，取值见 §2.2 CATEGORIES，分类器可覆盖（§3.2）
#   region           初始地区提示，取值见 §2.2 REGIONS，即 §3.2 地区分类 Priority 1
#                    "source_media → 预设映射表" 的映射值
#   language         语言标记（§2.1 默认 zh-CN）
#   enabled          是否启用；运行期自动禁用状态存于 source_health 表（§4.4）

sources:
  # ---- 国内：直连 RSS ----
  - id: people_politics
    name: 人民网·时政
    type: rss
    url: http://www.people.com.cn/rss/politics.xml
    fallback_rsshub: null
    category: politics
    region: china
    language: zh-CN
    enabled: true

  - id: chinadaily_china
    name: 中国日报·中国
    type: rss
    url: http://www.chinadaily.com.cn/rss/china_rss.xml
    fallback_rsshub: null
    category: other
    region: china
    language: en
    enabled: true

  - id: ftchinese_news
    name: FT中文网
    type: rss
    url: http://www.ftchinese.com/rss/news
    fallback_rsshub: null
